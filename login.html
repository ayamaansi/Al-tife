<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول لوحة التحكم | مكتب المحامية طيف العروي</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body class="login-page-body">

    <!-- خلفية الشعار المائي الثابتة -->
    <div class="global-fixed-watermark">
        <img src="bg-watermark.png" alt="" aria-hidden="true">
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="logo.png" alt="شعار المحامية طيف العروي" class="login-logo">
                <h2>لوحة التحكم الإدارية</h2>
                <p>يرجى تسجيل الدخول للمتابعة</p>
            </div>

            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="username">اسم المستخدم أو البريد</label>
                    <div class="input-with-icon">
                        <i data-lucide="user"></i>
                        <input type="text" id="username" placeholder="أدخل اسم المستخدم" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <div class="input-with-icon">
                        <i data-lucide="lock"></i>
                        <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <span>دخول</span>
                    <i data-lucide="arrow-left"></i>
                </button>
            </form>

            <div class="login-footer">
                <a href="index.html"><i data-lucide="arrow-right"></i> العودة للموقع الرئيسي</a>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
