<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | المحامية طيف</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, var(--brand-dark), #1A4A35);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }
        .global-fixed-watermark img { opacity: 0.05; }
        
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            z-index: 10;
        }
        .login-card img { width: 90px; margin-bottom: 1.5rem; }
        .login-card h2 { color: var(--brand-dark); font-weight: 800; margin-bottom: 0.5rem; }
        .login-card p { color: #64748b; font-size: 0.95rem; margin-bottom: 2rem; }
        
        .form-group { text-align: right; margin-bottom: 1.5rem; }
        .form-group label { display: block; font-weight: 700; color: #1e293b; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .login-input {
            width: 100%; padding: 1rem; border: 2px solid #e2e8f0; border-radius: 10px;
            font-family: inherit; font-size: 1rem; transition: all 0.3s ease; box-sizing: border-box;
            background: #f8fafc; text-align: left; direction: ltr;
        }
        .login-input:focus { outline: none; border-color: var(--brand-gold); background: white; box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1); }
        
        .login-btn {
            width: 100%; padding: 1rem; background: var(--brand-gold); color: white; border: none;
            border-radius: 10px; font-size: 1.1rem; font-weight: 800; cursor: pointer;
            transition: all 0.3s ease; display: flex; justify-content: center; align-items: center; gap: 0.5rem;
        }
        .login-btn:hover { background: #b8962e; transform: translateY(-2px); }
        .login-btn:disabled { background: #ccc; cursor: not-allowed; transform: none; }
        
        #error-msg { color: #e74c3c; font-size: 0.9rem; margin-top: 1rem; font-weight: 600; display: none; }
        #success-msg { color: #27ae60; font-size: 0.9rem; margin-top: 1rem; font-weight: 600; display: none; }
        
        .otp-inputs { display: flex; gap: 0.5rem; justify-content: space-between; direction: ltr; }
        .otp-inputs input { width: 45px; height: 50px; text-align: center; font-size: 1.5rem; font-weight: bold; border: 2px solid #e2e8f0; border-radius: 10px; background: #f8fafc; }
        .otp-inputs input:focus { outline: none; border-color: var(--brand-gold); background: white; }
    </style>
</head>
<body>
    <div class="global-fixed-watermark"><img src="bg-watermark.png" alt=""></div>

    <div class="login-card">
        <img src="logo.png" alt="شعار المحامية طيف">
        <h2>تسجيل الدخول للوحة التحكم</h2>
        <p id="step-description">الرجاء إدخال البريد الإلكتروني المعتمد للمكتب لتلقي كود الدخول.</p>

        <!-- الخطوة 1: إدخال الإيميل -->
        <form id="email-form">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="admin-email" class="login-input" placeholder="admin@example.com" required>
            </div>
            <button type="submit" class="login-btn" id="send-btn">
                <span>إرسال كود التحقق</span>
                <i data-lucide="send" style="width: 18px; height: 18px;"></i>
            </button>
        </form>

        <!-- الخطوة 2: إدخال الكود (مخفية في البداية) -->
        <form id="otp-form" style="display: none;">
            <div class="form-group" style="text-align: center;">
                <label style="text-align: center; margin-bottom: 1rem;">أدخل الكود المكون من 6 أرقام المرسل لإيميلك</label>
                <div class="otp-inputs">
                    <input type="text" maxlength="1" required class="otp-char">
                    <input type="text" maxlength="1" required class="otp-char">
                    <input type="text" maxlength="1" required class="otp-char">
                    <input type="text" maxlength="1" required class="otp-char">
                    <input type="text" maxlength="1" required class="otp-char">
                    <input type="text" maxlength="1" required class="otp-char">
                </div>
            </div>
            <button type="submit" class="login-btn" id="verify-btn">
                <span>تسجيل الدخول</span>
                <i data-lucide="log-in" style="width: 18px; height: 18px;"></i>
            </button>
            <a href="#" id="back-to-email" style="display: block; margin-top: 1rem; color: #64748b; text-decoration: underline; font-size: 0.9rem;">تغيير البريد الإلكتروني</a>
        </form>

        <div id="error-msg"></div>
        <div id="success-msg"></div>
    </div>

    <script src="login.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
